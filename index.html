x.fillStyle='#f2c230';for(let p=140;p<380;p+=40){x.fillRect(-3,p,6,22);x.fillRect(w-3,p,6,22);x.fillRect(p,-3,22,6);x.fillRect(p,w-3,22,6)}

x.fillStyle='rgba(255,255,255,.28)';x.beginPath();x.moveTo(10,10);x.lineTo(36,10);x.lineTo(10,40);x.fill();x.fillStyle='#cfc9bd';x.fillRect(10,30,44,2)});

const CT={
 hatch:{L:1.85,w:1.7,wb:.98,rb:.96,fb:.76,rh:1.52,a:-1.1,b:.75,c:-.85,d:.2,r:.38},
 sedan:{L:2.15,w:1.75,wb:.98,rb:1,fb:.8,rh:1.48,a:-1.2,b:.9,c:-.8,d:.3,r:.38},

const chaikin=(p,n)=>{for(let k=0;k<n;k++){const q=[];for(let i=0;i<p.length;i++){const a=p[i],b=p[(i+1)%p.length];q.push([.75*a[0]+.25*b[0],.75*a[1]+.25*b[1]],[.25*a[0]+.75*b[0],.25*a[1]+.75*b[1]])}p=q}return p};
const dkM=new THREE.MeshStandardMaterial({color:0x111214,roughness:.7}),tm=new THREE.MeshStandardMaterial({color:0x101010,roughness:.85}),rm=new THREE.MeshStandardMaterial({color:0xd5d9de,metalness:1,roughness:.2});
function mkCar(o){
 const T=CT[o.t||'sedan'],{L,w,wb,rb,fb,rh,a,b,c,d,r}=T,sp=T.sp||0;

 const ex=(pts,wd,mt,sm)=>{pts=chaikin(pts,sm);const sh=new THREE.Shape();pts.forEach((p,i)=>i?sh.lineTo(p[0],p[1]):sh.moveTo(p[0],p[1]));

 ex([[-L,.38],[-L,rb],[a+.1,wb],[b+.2,wb],[L*.62,(wb+fb)/2+.02],[L,fb],[L,.38]],w-.2,paint,3);
 ex([[a,wb-.04],[c,rh],[d,rh],[b,wb-.04]],w-.35,glass,3);
 ex([[c+.04,rh-.05],[d-.04,rh-.05],[d-.04,rh+.02],[c+.04,rh+.02]],w-.45,paint,1);
 const em=(c,i)=>new THREE.MeshStandardMaterial({color:c,emissive:c,emissiveIntensity:i});
 const head=em(0xfff3c0,1.8),tail=em(0xff1a1a,.8);
 const bx=(W,H,D,m,x,y,z)=>{const q=new THREE.Mesh(new THREE.BoxGeometry(W,H,D),m);q.position.set(x,y,z);q.castShadow=true;body.add(q);return q};
 bx(w-.5,.2,L*1.7,dkM,0,.4,0);bx(w*.4,.12,.06,dkM,0,fb-.12,L+.1);
 for(const s of[-1,1]){
  bx(sp?w*.3:w*.2,sp?.06:.13,.08,head,s*w*.3,fb-.03,L+.1);
  bx(sp?w*.34:w*.22,.1,.08,tail,s*w*.28,rb-.08,-L-.1);

  for(const s of[-1,1]){bx(.06,y-rb+.05,.1,dkM,s*w*.25,(y+rb)/2,-L+.25);

  bx(w,.05,.35,dkM,0,.4,L+.02);bx(w*.7,.04,.06,tail,0,rb-.06,-L-.1)}

 const tg=new THREE.CylinderGeometry(r,r,tw,24).rotateZ(Math.PI/2),fg=new THREE.CylinderGeometry(r*.66,r*.66,tw+.02,20).rotateZ(Math.PI/2),cg=new THREE.CylinderGeometry(r*.5,r*.5,tw+.03,16).rotateZ(Math.PI/2),sg=new THREE.BoxGeometry(tw+.05,.07,r*.5);
 const wh=[];[[-1,L*.62,1],[1,L*.62,1],[-1,-L*.6,0],[1,-L*.6,0]].forEach(([sx,z,f])=>{const pv=new THREE.Group();pv.position.set(sx*(w/2-.02),r,z);

function mkP(g,top,acc){return{g,body:g.userData.body,wh:g.userData.wh,x:0,z:0,h:0,vx:0,vz:0,y:0,vy:0,steer:0,vf:0,vl:0,top,acc}}
function phys(c,k,dt){
 const fx=Math.sin(c.h),fz=Math.cos(c.h),rx=fz,rz=-fx;
 let vf=c.vx*fx+c.vz*fz,vl=c.vx*rx+c.vz*rz;const air=c.y>.05,hand=!!k.h;
 c.steer+=(((k.l?1:0)-(k.r?1:0))-c.steer)*Math.min(1,8*dt);
 if(!air){
  if(k.u)vf+=Math.max(0,c.acc*(1-vf/c.top))*dt;
  if(k.d){if(vf>1)vf-=42*dt;else vf=Math.max(-14,vf-14*dt)}
  if(!k.u&&!k.d)vf*=Math.exp(-.5*dt);
  if(hand)vf*=Math.exp(-.35*dt);
  vl*=Math.exp(-(hand?1.2:Math.max(2.2,7-Math.abs(c.steer)*Math.abs(vf)*.12))*dt);
  c.h+=c.steer*(hand?2.8:2)*Math.min(1,Math.abs(vf)/6)*Math.sign(vf)/(1+Math.abs(vf)/50)*dt}

 const sp=Math.hypot(c.vx,c.vz);
 if(!air)for(const[a,b]of ramps)if(Math.abs(c.x-a)<4&&Math.abs(c.z-b)<5.5&&sp>7){c.vy=Math.min(15,sp*.32);c.y=.06}
 if(c.y>0){c.vy-=30*dt;c.y+=c.vy*dt;if(c.y<=0){c.y=0;c.vy=0}}
 let imp=0;
 for(const b of blds){const px=c.x-b.x,pz=c.z-b.z,ox=b.hw+1.4-Math.abs(px),oz=b.hd+1.4-Math.abs(pz);
  if(ox>0&&oz>0&&c.y<40){if(ox<oz){imp=Math.max(imp,Math.abs(c.vx));c.x+=Math.sign(px)*ox;c.vx*=-.3;c.vz*=.8}else{imp=Math.max(imp,Math.abs(c.vz));c.z+=Math.sign(pz)*oz;c.vz*=-.3;c.vx*=.8}}}
 c.x=Math.max(-235,Math.min(235,c.x));c.z=Math.max(-235,Math.min(235,c.z));

 if(d==0){t.x=c-5;t.z=p}else if(d==1){t.x=c+5;t.z=-p}else if(d==2){t.z=c+5;t.x=p}else{t.z=c-5;t.x=-p}

function selCar(i){ci=(i+CARS.length)%CARS.length;garage.forEach((g,k)=>g.visible=k==ci);const g=garage[ci],C=CARS[ci];P.g=g;P.body=g.userData.body;P.wh=g.userData.wh;P.top=C.top;P.acc=C.acc;g.position.set(P.x,0,P.z);g.rotation.y=P.h;
 $('cn').textContent=C.n;$('cs').textContent='Máx. '+Math.round(C.top*3.2)+' km/h · Aceleração '+'▮'.repeat(Math.round(C.acc/7))}
$('pv').onclick=()=>selCar(ci-1);$('nx').onclick=()=>selCar(ci+1);selCar(0);
['#e63946','#ffd60a','#2a9d8f','#4361ee','#f8f9fa','#111111'].forEach(c=>{const d=document.createElement('i');d.style.background=c;d.onclick=()=>P.g.userData.paint.color.set(c);$('dots').appendChild(d)});
// Jogo
let state='menu',hp=100,heat=0,stars=0,score=0,combo=0,dtm=0,shake=0,msgT=0,tt=0,inv=0,spawnT=0;
function say(t,s=2){$('msg').textContent=t;$('msg').style.opacity=1;msgT=s}
function hurt(n){if(inv>0||state!='play')return;hp-=n;inv=.35;shake=Math.min(1,n/14);if(hp<=0){hp=0;state='over';$('fs').textContent='Pontos: '+score;$('over').style.display='flex'}}
function crime(n,t){if(!stars)say(t||'CRIME! A polícia está a caminho');heat=Math.min(100,heat+n)}
function reset(){Object.assign(P,{x:0,z:20,h:Math.PI,vx:0,vz:0,y:0,vy:0,steer:0});hp=100;heat=0;stars=0;score=0;combo=0;dtm=0;inv=0;
 cops.forEach(c=>{c.on=false;c.g.visible=false});traffic.forEach(t=>{t.pos=(rnd()*2-1)*230;t.cur=0;t.stun=0;tplace(t)})}
function spawnCop(c){const a=rnd()*6.28;const tx=Math.max(-220,Math.min(220,P.x+Math.cos(a)*100)),tz=Math.max(-220,Math.min(220,P.z+Math.sin(a)*100));
 Object.assign(c,{on:true,x:25+50*Math.round((tx-25)/50),z:tz,vx:0,vz:0,y:0,vy:0,stuck:0,rev:0});c.h=Math.atan2(P.x-c.x,P.z-c.z);c.g.visible=true}
$('play').onclick=()=>{$('menu').style.display='none';$('hud').style.display='block';reset();state='play'};
$('again').onclick=()=>{$('over').style.display='none';reset();state='play'};
traffic.forEach(tplace);P.x=0;P.z=20;P.h=Math.PI;P.g.position.set(0,0,20);P.g.rotation.y=Math.PI;
let camH=Math.PI,last=performance.now();
function step(dt){
 tt+=dt;inv=Math.max(0,inv-dt);shake*=Math.exp(-6*dt);
 if(msgT>0){msgT-=dt;if(msgT<=0)$('msg').style.opacity=0}
 const play=state=='play';
 for(const t of traffic){t.stun=Math.max(0,t.stun-dt);t.cur+=((t.stun>0?0:t.spd)-t.cur)*Math.min(1,3*dt);
  t.pos+=t.cur*dt;if(t.pos>235)t.pos=-235;tplace(t);t.wh.forEach(w=>w.w.rotation.x+=t.cur*dt/.4)}
 let imp=0;
 if(play)imp=phys(P,K,dt);
 P.g.userData.tail.emissiveIntensity=K.d&&play?3.5:.8;
 if(play){
  if(imp>6){hurt(imp*.9);if(imp>12)crime(12,'BATIDA! Polícia alertada')}
  for(const t of traffic){const dx=P.x-t.x,dz=P.z-t.z,d=Math.hypot(dx,dz);
   if(d<2.7&&d>.01&&P.y<1.2){const nx=dx/d,nz=dz/d,vn=P.vx*nx+P.vz*nz;P.x+=nx*(2.7-d);P.z+=nz*(2.7-d);
    if(vn<-2){P.vx-=1.5*vn*nx;P.vz-=1.5*vn*nz;hurt(-vn*.8);crime(25);t.stun=2}}}
  let near=false;const want=[0,1,2,4,6,8][stars];let act=cops.filter(c=>c.on).length;
  for(const c of cops){if(!c.on)continue;
   const dx=P.x-c.x,dz=P.z-c.z,d=Math.hypot(dx,dz);if(d<70)near=true;
   if(d<25)heat=Math.min(100,heat+2.5*dt);
   if(act>want&&d>80){c.on=false;c.g.visible=false;act--;continue}
   c.top=40+stars*6;c.acc=24+stars*4;
   const ld=Math.min(1,d/40)*.7,df=adiff(Math.atan2(P.x+P.vx*ld-c.x,P.z+P.vz*ld-c.z),c.h),sp=Math.hypot(c.vx,c.vz);
   if(sp<3)c.stuck+=dt;else c.stuck=0;if(c.stuck>1){c.rev=.9;c.stuck=0}
   const inp=c.rev>0?{d:1,l:1}:{u:d>5||sp<8,l:df>.08,r:df<-.08};c.rev=Math.max(0,c.rev-dt);
   phys(c,inp,dt);
   if(d<2.8&&d>.01){const nx=dx/d,nz=dz/d,vr=(P.vx-c.vx)*nx+(P.vz-c.vz)*nz;
    P.x+=nx*(2.8-d)/2;P.z+=nz*(2.8-d)/2;c.x-=nx*(2.8-d)/2;c.z-=nz*(2.8-d)/2;
    if(vr<0){P.vx-=nx*vr*.6;P.vz-=nz*vr*.6;c.vx+=nx*vr*.6;c.vz+=nz*vr*.6;hurt(Math.min(14,-vr*.9))}}
   const f=Math.floor(tt*7)%2;c.g.userData.lb[0].material.emissiveIntensity=f?4:.1;c.g.userData.lb[1].material.emissiveIntensity=f?.1:4}
  for(let i=0;i<cops.length;i++)for(let j=i+1;j<cops.length;j++){const p=cops[i],q=cops[j];if(!p.on||!q.on)continue;
   const dx=p.x-q.x,dz=p.z-q.z,d=Math.hypot(dx,dz);if(d<2.8&&d>.01){const o=(2.8-d)/2;p.x+=dx/d*o;p.z+=dz/d*o;q.x-=dx/d*o;q.z-=dz/d*o}}
  if(!near)heat=Math.max(0,heat-7*dt);
  const ns=heat<15?0:heat<35?1:heat<55?2:heat<75?3:heat<90?4:5;
  if(stars>0&&ns==0){say('VOCÊ ESCAPOU! +500');score+=500}else if(ns>stars&&stars>0)say('PROCURADO NÍVEL '+ns+'!');
  stars=ns;spawnT-=dt;if(act<[0,1,2,4,6,8][ns]&&spawnT<=0){const c=cops.find(c=>!c.on);if(c){spawnCop(c);spawnT=.6}}
  const spd=Math.hypot(P.vx,P.vz);
  if(P.y<.05&&Math.abs(P.vl)>3.5&&spd>8){combo+=Math.abs(P.vl)*dt*10;dtm=.7;
   const fx=Math.sin(P.h),fz=Math.cos(P.h);for(const s of[-1,1])if(Math.random()<.6)puff(P.x-fx*1.3+fz*s,.5,P.z-fz*1.3-fx*s)}
  else if(dtm>0){dtm-=dt;if(dtm<=0){score+=Math.floor(combo);combo=0}}
  if(imp>6)combo=0;
  $('spd').textContent=Math.round(spd*3.2)+' km/h';$('dr').textContent=combo>5?'DRIFT +'+Math.floor(combo):'';
  $('sc').textContent='Pontos: '+score;$('hp').style.width=hp+'%';$('st').textContent='★'.repeat(stars)+'☆'.repeat(5-stars)}
 smoke.forEach(s=>{if(s.life>0){s.life-=dt*1.4;s.m.position.y+=dt*1.2;s.m.scale.setScalar(1+(1-s.life)*3);s.m.material.opacity=Math.max(0,s.life*.55);if(s.life<=0)s.m.visible=false}});
 const spd=Math.hypot(P.vx,P.vz);
 if(state=='menu'){const a=tt*.4;cam.position.set(P.x+Math.sin(a)*7,2.2,P.z+Math.cos(a)*7);cam.lookAt(P.x,-.6,P.z)}
 else{camH+=adiff(P.h,camH)*Math.min(1,4*dt);
  const cx=P.x-Math.sin(camH)*9,cz=P.z-Math.cos(camH)*9,k=Math.min(1,8*dt);
  cam.position.x+=(cx-cam.position.x)*k;cam.position.z+=(cz-cam.position.z)*k;cam.position.y+=(P.y+4.3-cam.position.y)*Math.min(1,6*dt);
  cam.position.x+=(Math.random()-.5)*shake;cam.position.y+=(Math.random()-.5)*shake;
  cam.lookAt(P.x+Math.sin(camH)*4,P.y+1.2,P.z+Math.cos(camH)*4)}
 const fov=65+Math.min(18,spd*.35);if(Math.abs(cam.fov-fov)>.1){cam.fov+=(fov-cam.fov)*.1;cam.updateProjectionMatrix()}
 sky.position.copy(cam.position);sun.position.set(P.x+60,100,P.z+40);sun.target.position.set(P.x,0,P.z)}
(function loop(t){requestAnimationFrame(loop);const dt=Math.min(.05,(t-last)/1000);last=t;step(dt);ren.render(scene,cam)})(last);
</script></body></html>
