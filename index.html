function mkP(g,top,acc){return{g,body:g.userData.body,wh:g.userData.wh,x:0,z:0,h:0,vx:0,vz:0,y:0,vy:0,steer:0,vf:0,vl:0,top,acc}}
function phys(c,k,dt){
 const fx=Math.sin(c.h),fz=Math.cos(c.h),rx=fz,rz=-fx;
 let vf=c.vx*fx+c.vz*fz,vl=c.vx*rx+c.vz*rz;const air=c.y>.05,hand=!!k.h;

 if(!air){
  if(k.u)vf+=Math.max(0,c.acc*(1-vf/c.top))*dt;
  if(k.d){if(vf>1)vf-=38*dt;else vf=Math.max(-10,vf-8*dt)}
  if(!k.u&&!k.d)vf*=Math.exp(-.35*dt);
  if(hand)vf*=Math.exp(-.2*dt);
  vl*=Math.exp(-(hand?.9:Math.max(2,6.5-Math.abs(c.steer)*Math.abs(vf)*.13))*dt);
  c.h+=c.steer*(hand?3.2:2)*Math.min(1,Math.abs(vf)/6)*Math.sign(vf)/(1+Math.abs(vf)/45)*dt}
 const f2x=Math.sin(c.h),f2z=Math.cos(c.h);
 c.vx=vf*f2x+vl*f2z;c.vz=vf*f2z-vl*f2x;c.x+=c.vx*dt;c.z+=c.vz*dt;
 const sp=Math.hypot(c.vx,c.vz);
 if(!air)for(const[a,b]of ramps)if(Math.abs(c.x-a)<4&&Math.abs(c.z-b)<5.5&&sp>7){c.vy=Math.min(15,sp*.32);c.y=.06}
 if(c.y>0){c.vy-=30*dt;c.y+=c.vy*dt;if(c.y<=0){c.y=0;c.vy=0}}
 let imp=0;
 nearB(c.x,c.z,b=>{const px=c.x-b.x,pz=c.z-b.z,ox=b.hw+1.4-Math.abs(px),oz=b.hd+1.4-Math.abs(pz);
  if(ox>0&&oz>0&&c.y<40){if(ox<oz){imp=Math.max(imp,Math.abs(c.vx));c.x+=Math.sign(px)*ox;c.vx*=-.3;c.vz*=.8}else{imp=Math.max(imp,Math.abs(c.vz));c.z+=Math.sign(pz)*oz;c.vz*=-.3;c.vx*=.8}}});
 c.x=Math.max(-2500,Math.min(2500,c.x));c.z=Math.max(-2500,Math.min(2500,c.z));
 c.vf=vf;c.vl=vl;
 c.g.position.set(c.x,c.y,c.z);c.g.rotation.y=c.h;
 c.body.rotation.x=-Math.max(-.5,Math.min(.5,c.vy*.03));c.body.rotation.z=-vl*.012;
 c.wh.forEach(w=>{if(w.f)w.pv.rotation.y=c.steer*.5;w.w.rotation.x+=vf*dt/.4});
 return imp}

 if(msgT>0){msgT-=dt;if(msgT<=0)$('msg').style.opacity=0}

  for(const t of traffic){const dx=P.x-t.x,dz=P.z-t.z,d=Math.hypot(dx,dz);

   const f=Math.floor(tt*7)%2;c.g.userData.lb[0].material.emissiveIntensity=f?4:.1;c.g.userData.lb[1].material.emissiveIntensity=f?.1:4}
  for(let i=0;i<cops.length;i++)for(let j=i+1;j<cops.length;j++){const p=cops[i],q=cops[j];if(!p.on||!q.on)continue;

 smoke.forEach(s=>{if(s.life>0){s.life-=dt*1.4;s.m.position.y+=dt*1.2;s.m.scale.setScalar(1+(1-s.life)*3);s.m.material.opacity=Math.max(0,s.life*.55);if(s.life<=0)s.m.visible=false}});

 if(state=='menu'){const a=tt*.4;cam.position.set(P.x+Math.sin(a)*6.5,1.8,P.z+Math.cos(a)*6.5);cam.lookAt(P.x,-.5,P.z)}
