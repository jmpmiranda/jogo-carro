<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
let seed=11;const rnd=()=>(seed=(seed*16807)%2147483647)/2147483647;
const adiff=(a,b)=>Math.atan2(Math.sin(a-b),Math.cos(a-b));
const ren=new THREE.WebGLRenderer({antialias:true});ren.setSize(innerWidth,innerHeight);ren.setPixelRatio(Math.min(devicePixelRatio,2));
ren.outputEncoding=THREE.sRGBEncoding;ren.toneMapping=THREE.ACESFilmicToneMapping;ren.toneMappingExposure=1.05;
ren.shadowMap.enabled=true;ren.shadowMap.type=THREE.PCFSoftShadowMap;document.body.appendChild(ren.domElement);
const scene=new THREE.Scene();const cam=new THREE.PerspectiveCamera(65,innerWidth/innerHeight,.1,700);
addEventListener('resize',()=>{cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix();ren.setSize(innerWidth,innerHeight)});
const lin=h=>new THREE.Color(h).convertSRGBToLinear();
// Céu
const skyMat=new THREE.ShaderMaterial({side:THREE.BackSide,depthWrite:false,fog:false,uniforms:{top:{value:lin(0x3f86d6)},hor:{value:lin(0xffdcae)}},
vertexShader:'varying vec3 vP;void main(){vP=normalize(position);gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}',
fragmentShader:'uniform vec3 top,hor;varying vec3 vP;void main(){float h=clamp(vP.y,0.,1.);vec3 c=mix(hor,top,pow(h,.55));float s=max(dot(vP,normalize(vec3(.5,.35,.3))),0.);c+=vec3(1.,.8,.5)*(pow(s,300.)*3.+pow(s,10.)*.3);gl_FragColor=linearToOutputTexel(vec4(c,1.));}'});
const sky=new THREE.Mesh(new THREE.SphereGeometry(1,24,16),skyMat);sky.scale.setScalar(600);scene.add(sky);
scene.fog=new THREE.Fog(lin(0xffdcae),110,380);
try{const es=new THREE.Scene();const m=new THREE.Mesh(new THREE.SphereGeometry(50,24,16),skyMat);es.add(m);
const pm=new THREE.PMREMGenerator(ren);scene.environment=pm.fromScene(es).texture}catch(e){}
scene.add(new THREE.HemisphereLight(0xcfe3ff,0x6b5d4f,.7));
const sun=new THREE.DirectionalLight(0xfff0d6,2.2);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);sun.shadow.bias=-.0004;
const sc=sun.shadow.camera;sc.left=sc.bottom=-60;sc.right=sc.top=60;sc.far=300;scene.add(sun,sun.target);
// Texturas
function cv(w,h,f){const c=document.createElement('canvas');c.width=w;c.height=h;f(c.getContext('2d'),w,h);const t=new THREE.CanvasTexture(c);t.encoding=THREE.sRGBEncoding;t.wrapS=t.wrapT=THREE.RepeatWrapping;t.anisotropy=8;return t}
const gt=cv(512,512,(x,w)=>{x.fillStyle='#3c3f45';x.fillRect(0,0,w,w);
for(let i=0;i<7000;i++){x.fillStyle='rgba('+(rnd()<.5?255:0)+','+(rnd()<.5?255:0)+',255,'+rnd()*.05+')';x.fillRect(rnd()*w,rnd()*w,2,2)}
x.fillStyle='#a3a6aa';x.fillRect(102,102,308,308);x.strokeStyle='#d8dadd';x.lineWidth=5;x.strokeRect(102,102,308,308);
x.strokeStyle='rgba(0,0,0,.12)';x.lineWidth=1;for(let p=102;p<410;p+=28){x.beginPath();x.moveTo(p,102);x.lineTo(p,410);x.moveTo(102,p);x.lineTo(410,p);x.stroke()}
x.fillStyle='#f2c230';for(let p=140;p<380;p+=40){x.fillRect(-3,p,6,22);x.fillRect(w-3,p,6,22);x.fillRect(p,-3,22,6);x.fillRect(p,w-3,22,6)}
x.fillStyle='#eee';for(let a=8;a<100;a+=16)for(const b of[112,376]){x.fillRect(a,b,8,26);x.fillRect(a+410,b,8,26);x.fillRect(b,a,26,8);x.fillRect(b,a+410,26,8)}});
gt.repeat.set(18,18);gt.offset.set(.5,.5);
const ground=new THREE.Mesh(new THREE.PlaneGeometry(900,900),new THREE.MeshStandardMaterial({map:gt,roughness:.9}));ground.rotation.x=-Math.PI/2;ground.receiveShadow=true;scene.add(ground);
const wt=cv(64,64,x=>{x.fillStyle='#ece7de';x.fillRect(0,0,64,64);const g=x.createLinearGradient(0,10,0,54);g.addColorStop(0,'#a8cbe6');g.addColorStop(1,'#35506a');x.fillStyle=g;x.fillRect(10,10,44,44);
x.fillStyle='rgba(255,255,255,.28)';x.beginPath();x.moveTo(10,10);x.lineTo(36,10);x.lineTo(10,40);x.fill();x.fillStyle='#cfc9bd';x.fillRect(10,30,44,2)});
const pal=[0xf1faee,0xd7e3fc,0xffd6a5,0xe2cfea,0xbde0fe,0xffc8dd,0xd8f3dc];
const bm=pal.map(c=>new THREE.MeshStandardMaterial({color:c,map:wt,roughness:.5,metalness:.1,envMapIntensity:.7}));
const roofM=new THREE.MeshStandardMaterial({color:0x555a60,roughness:.9});
const blds=[];
for(let i=-4;i<=4;i++)for(let j=-4;j<=4;j++){if(!i&&!j)continue;
 for(const ox of[-7.5,7.5])for(const oz of[-7.5,7.5]){if(rnd()<.15)continue;
  const h=10+rnd()*45,g=new THREE.BoxGeometry(12,h,12),uv=g.attributes.uv;
  for(let n=0;n<24;n++){const f=Math.floor(n/4),top=f==2||f==3;uv.setXY(n,uv.getX(n)*3,uv.getY(n)*(top?3:h/4))}
  const m=new THREE.Mesh(g,bm[Math.floor(rnd()*7)]);m.position.set(i*50+ox,h/2,j*50+oz);m.castShadow=m.receiveShadow=true;scene.add(m);
  const r=new THREE.Mesh(new THREE.BoxGeometry(12.4,.6,12.4),roofM);r.position.set(m.position.x,h+.3,m.position.z);scene.add(r);
  blds.push({x:m.position.x,z:m.position.z,hw:6,hd:6})}}
const ramps=[[25,-70],[-25,60],[75,10],[-75,-20],[0,-12],[125,-125],[-125,125],[25,110]];
const rampM=new THREE.MeshStandardMaterial({color:0xff8c42,roughness:.5});
ramps.forEach(([x,z])=>{const r=new THREE.Mesh(new THREE.BoxGeometry(8,.6,11),rampM);r.position.set(x,.9,z);r.rotation.x=-.28;r.castShadow=true;scene.add(r)});

// Carros detalhados (carroceria extrudada com bisel, vidro e pintura metálica)
function mkCar(o){
 const g=new THREE.Group(),body=new THREE.Group();g.add(body);
 const paint=new THREE.MeshPhysicalMaterial({color:o.color,metalness:.6,roughness:.3,clearcoat:1,clearcoatRoughness:.05});
 const glass=new THREE.MeshPhysicalMaterial({color:0x0e141b,metalness:.9,roughness:.06,envMapIntensity:1.5});
 const ex=(pts,w,mt)=>{const s=new THREE.Shape();pts.forEach((p,i)=>i?s.lineTo(p[0],p[1]):s.moveTo(p[0],p[1]));
  const gm=new THREE.ExtrudeGeometry(s,{depth:w,bevelEnabled:true,bevelThickness:.1,bevelSize:.1,bevelSegments:3,curveSegments:1});
  gm.rotateY(-Math.PI/2);gm.translate(w/2,0,0);const m=new THREE.Mesh(gm,mt);m.castShadow=true;body.add(m);return m};
 ex([[-2.1,.35],[-2.1,.9],[-1.6,1.0],[-.9,1.02],[.9,.98],[1.6,.88],[2.1,.78],[2.1,.35]],1.7,paint);
 ex([[-1.2,1.0],[-.85,1.48],[.3,1.52],[.95,1.0]],1.5,glass);
 ex([[-.8,1.5],[.25,1.54],[.25,1.6],[-.75,1.57]],1.3,paint);
 const em=(c,i)=>new THREE.MeshStandardMaterial({color:c,emissive:c,emissiveIntensity:i});
 const head=em(0xfff3c0,1.6),tail=em(0xff1a1a,.8);
 const bx=(w,h,d,m,x,y,z)=>{const b=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),m);b.position.set(x,y,z);body.add(b);return b};
 for(const s of[-1,1]){bx(.5,.16,.08,head,s*.62,.8,2.22);bx(.5,.16,.08,tail,s*.62,.85,-2.22)}
 bx(1.3,.12,.06,new THREE.MeshStandardMaterial({color:0x222222}),0,.55,2.22);
 body.scale.y=o.sy||1;
 const tire=new THREE.CylinderGeometry(.4,.4,.32,18).rotateZ(Math.PI/2),rim=new THREE.CylinderGeometry(.27,.27,.34,10).rotateZ(Math.PI/2);
 const tm=new THREE.MeshStandardMaterial({color:0x111111,roughness:.9}),rm=new THREE.MeshStandardMaterial({color:0xcfd3d9,metalness:1,roughness:.25});
 const wh=[];[[-1,1.35,1],[1,1.35,1],[-1,-1.35,0],[1,-1.35,0]].forEach(([sx,z,f])=>{const pv=new THREE.Group();pv.position.set(sx*.98,.4,z);
  const w=new THREE.Mesh(tire,tm);w.castShadow=true;w.add(new THREE.Mesh(rim,rm));pv.add(w);g.add(pv);wh.push({pv,w,f})});
 let lb=null;
 if(o.police){const wm=new THREE.MeshStandardMaterial({color:0xffffff});bx(.02,.25,2,wm,1.0,.75,0);bx(.02,.25,2,wm,-1.0,.75,0);
  lb=[bx(.5,.14,.3,em(0xff0000,.2),-.35,1.68,-.2),bx(.5,.14,.3,em(0x0044ff,.2),.35,1.68,-.2)]}
 g.userData={body,wh,paint,tail,lb};return g}
// Física
function mkP(g,top,acc){return{g,body:g.userData.body,wh:g.userData.wh,x:0,z:0,h:0,vx:0,vz:0,y:0,vy:0,steer:0,vf:0,vl:0,top,acc}}
function phys(c,k,dt){
 const fx=Math.sin(c.h),fz=Math.cos(c.h),rx=fz,rz=-fx;
 let vf=c.vx*fx+c.vz*fz,vl=c.vx*rx+c.vz*rz;const air=c.y>.05,hand=!!k.h;
 c.steer+=(((k.l?1:0)-(k.r?1:0))-c.steer)*Math.min(1,8*dt);
 if(!air){
  if(k.u)vf+=Math.max(0,c.acc*(1-vf/c.top))*dt;
  if(k.d){if(vf>1)vf-=42*dt;else vf=Math.max(-14,vf-14*dt)}
  if(!k.u&&!k.d)vf*=Math.exp(-.5*dt);
  if(hand)vf*=Math.exp(-.35*dt);
  vl*=Math.exp(-(hand?1.2:Math.max(2.2,7-Math.abs(c.steer)*Math.abs(vf)*.12))*dt);
  c.h+=c.steer*(hand?2.8:2)*Math.min(1,Math.abs(vf)/6)*Math.sign(vf)/(1+Math.abs(vf)/50)*dt}
 const f2x=Math.sin(c.h),f2z=Math.cos(c.h);
 c.vx=vf*f2x+vl*f2z;c.vz=vf*f2z-vl*f2x;c.x+=c.vx*dt;c.z+=c.vz*dt;
 const sp=Math.hypot(c.vx,c.vz);
 if(!air)for(const[a,b]of ramps)if(Math.abs(c.x-a)<4&&Math.abs(c.z-b)<5.5&&sp>7){c.vy=Math.min(15,sp*.32);c.y=.06}
 if(c.y>0){c.vy-=30*dt;c.y+=c.vy*dt;if(c.y<=0){c.y=0;c.vy=0}}
 let imp=0;
 for(const b of blds){const px=c.x-b.x,pz=c.z-b.z,ox=b.hw+1.4-Math.abs(px),oz=b.hd+1.4-Math.abs(pz);
  if(ox>0&&oz>0&&c.y<40){if(ox<oz){imp=Math.max(imp,Math.abs(c.vx));c.x+=Math.sign(px)*ox;c.vx*=-.3;c.vz*=.8}else{imp=Math.max(imp,Math.abs(c.vz));c.z+=Math.sign(pz)*oz;c.vz*=-.3;c.vx*=.8}}}
 c.x=Math.max(-235,Math.min(235,c.x));c.z=Math.max(-235,Math.min(235,c.z));
 c.vf=vf;c.vl=vl;
 c.g.position.set(c.x,c.y,c.z);c.g.rotation.y=c.h;
 c.body.rotation.x=-Math.max(-.5,Math.min(.5,c.vy*.03));c.body.rotation.z=-vl*.012;
 c.wh.forEach(w=>{if(w.f)w.pv.rotation.y=c.steer*.5;w.w.rotation.x+=vf*dt/.4});
 return imp}
// Jogador, polícia, trânsito
const P=mkP(mkCar({color:0xe63946}),55,28);scene.add(P.g);
const cops=[];for(let i=0;i<3;i++){const c=mkP(mkCar({color:0x15181f,police:1}),50,25);c.on=false;c.stuck=0;c.rev=0;c.g.visible=false;scene.add(c.g);cops.push(c)}
const traffic=[],tcol=[0xf4a261,0x2a9d8f,0xe9c46a,0x6d6875,0xb5179e,0x90be6d,0xeeeeee,0x277da1];
for(let n=0;n<26;n++){const g=mkCar({color:tcol[n%8],sy:.9+rnd()*.3});scene.add(g);
 const k=Math.floor(rnd()*10)-5,dir=Math.floor(rnd()*4);
 traffic.push({g,wh:g.userData.wh,k,dir,pos:(rnd()*2-1)*230,spd:9+((k+5)*3+dir)%6,cur:0,stun:0,x:0,z:0,h:0})}
function tplace(t){const c=25+50*t.k,d=t.dir,p=t.pos;
 if(d==0){t.x=c-5;t.z=p}else if(d==1){t.x=c+5;t.z=-p}else if(d==2){t.z=c+5;t.x=p}else{t.z=c-5;t.x=-p}
 t.h=[0,Math.PI,Math.PI/2,-Math.PI/2][d];t.g.position.set(t.x,0,t.z);t.g.rotation.y=t.h}
// Fumaça
const smoke=[];for(let i=0;i<40;i++){const m=new THREE.Mesh(new THREE.SphereGeometry(.4,6,6),new THREE.MeshBasicMaterial({color:0xffffff,transparent:true,opacity:0}));m.visible=false;scene.add(m);smoke.push({m,life:0})}
let si=0;function puff(x,y,z){const s=smoke[si++%40];s.life=1;s.m.position.set(x,y,z);s.m.visible=true}
// Controles
const K={},map={ArrowUp:'u',w:'u',W:'u',ArrowDown:'d',s:'d',S:'d',ArrowLeft:'l',a:'l',A:'l',ArrowRight:'r',d:'r',D:'r',' ':'h'};
addEventListener('keydown',e=>{if(map[e.key]){K[map[e.key]]=1;e.preventDefault()}if((e.key=='r'||e.key=='R')&&state=='play')reset()});
addEventListener('keyup',e=>{if(map[e.key])K[map[e.key]]=0});
if('ontouchstart'in window)document.querySelectorAll('.b').forEach(b=>b.style.display='flex');
[['bl','l'],['br','r'],['bd','h'],['bb','d'],['bg','u']].forEach(([id,k])=>{const b=document.getElementById(id);
 b.addEventListener('pointerdown',e=>{K[k]=1;e.preventDefault()});['pointerup','pointerleave','pointercancel'].forEach(t=>b.addEventListener(t,()=>K[k]=0))});
const $=id=>document.getElementById(id);
['#e63946','#ffd60a','#2a9d8f','#4361ee','#f8f9fa','#111111'].forEach(c=>{const d=document.createElement('i');d.style.background=c;d.onclick=()=>P.g.userData.paint.color.set(c);$('dots').appendChild(d)});
// Jogo
let state='menu',hp=100,heat=0,stars=0,score=0,combo=0,dtm=0,shake=0,msgT=0,tt=0,inv=0;
function say(t,s=2){$('msg').textContent=t;$('msg').style.opacity=1;msgT=s}
function hurt(n){if(inv>0||state!='play')return;hp-=n;inv=.35;shake=Math.min(1,n/14);if(hp<=0){hp=0;state='over';$('fs').textContent='Pontos: '+score;$('over').style.display='flex'}}
function crime(n,t){if(!stars)say(t||'CRIME! A polícia está a caminho');heat=Math.min(100,heat+n)}
function reset(){Object.assign(P,{x:0,z:20,h:Math.PI,vx:0,vz:0,y:0,vy:0,steer:0});hp=100;heat=0;stars=0;score=0;combo=0;dtm=0;inv=0;
 cops.forEach(c=>{c.on=false;c.g.visible=false});traffic.forEach(t=>{t.pos=(rnd()*2-1)*230;t.cur=0;t.stun=0;tplace(t)})}
function spawnCop(c){const a=rnd()*6.28;const tx=Math.max(-220,Math.min(220,P.x+Math.cos(a)*100)),tz=Math.max(-220,Math.min(220,P.z+Math.sin(a)*100));
 Object.assign(c,{on:true,x:25+50*Math.round((tx-25)/50),z:tz,vx:0,vz:0,y:0,vy:0,stuck:0,rev:0});c.h=Math.atan2(P.x-c.x,P.z-c.z);c.g.visible=true}
$('play').onclick=()=>{$('menu').style.display='none';$('hud').style.display='block';reset();state='play'};
$('again').onclick=()=>{$('over').style.display='none';reset();state='play'};
traffic.forEach(tplace);P.x=0;P.z=20;P.h=Math.PI;P.g.position.set(0,0,20);P.g.rotation.y=Math.PI;
let camH=Math.PI,last=performance.now();
function step(dt){
 tt+=dt;inv=Math.max(0,inv-dt);shake*=Math.exp(-6*dt);
 if(msgT>0){msgT-=dt;if(msgT<=0)$('msg').style.opacity=0}
 const play=state=='play';
 for(const t of traffic){t.stun=Math.max(0,t.stun-dt);t.cur+=((t.stun>0?0:t.spd)-t.cur)*Math.min(1,3*dt);
  t.pos+=t.cur*dt;if(t.pos>235)t.pos=-235;tplace(t);t.wh.forEach(w=>w.w.rotation.x+=t.cur*dt/.4)}
 let imp=0;
 if(play)imp=phys(P,K,dt);
 P.g.userData.tail.emissiveIntensity=K.d&&play?3.5:.8;
 if(play){
  if(imp>6){hurt(imp*.9);if(imp>12)crime(12,'BATIDA! Polícia alertada')}
  for(const t of traffic){const dx=P.x-t.x,dz=P.z-t.z,d=Math.hypot(dx,dz);
   if(d<2.7&&d>.01&&P.y<1.2){const nx=dx/d,nz=dz/d,vn=P.vx*nx+P.vz*nz;P.x+=nx*(2.7-d);P.z+=nz*(2.7-d);
    if(vn<-2){P.vx-=1.5*vn*nx;P.vz-=1.5*vn*nz;hurt(-vn*.8);crime(25);t.stun=2}}}
  let near=false;
  for(const c of cops){if(!c.on)continue;
   const dx=P.x-c.x,dz=P.z-c.z,d=Math.hypot(dx,dz);if(d<70)near=true;
   if(!stars&&d>60){c.on=false;c.g.visible=false;continue}
   const df=adiff(Math.atan2(dx,dz),c.h),sp=Math.hypot(c.vx,c.vz);
   if(sp<3)c.stuck+=dt;else c.stuck=0;if(c.stuck>1){c.rev=.9;c.stuck=0}
   const inp=c.rev>0?{d:1,l:1}:{u:d>5||sp<8,l:df>.08,r:df<-.08};c.rev=Math.max(0,c.rev-dt);
   phys(c,inp,dt);
   if(d<2.8&&d>.01){const nx=dx/d,nz=dz/d,vr=(P.vx-c.vx)*nx+(P.vz-c.vz)*nz;
