$('gb').onclick=toMenu;
addEventListener('beforeunload',save);
traffic.forEach(tplace);P.x=0;P.z=22;P.h=Math.PI;selCar(0);
let camH=Math.PI,last=performance.now(),airT=0;
function step(dt){
 tt+=dt;inv=Math.max(0,inv-dt);shake*=Math.exp(-6*dt);
 if(msgT>0){msgT-=dt;if(msgT<=0)$('msg').style.opacity=0}
 const play=state=='play';
 for(const t of traffic){t.stun=Math.max(0,t.stun-dt);t.cur+=((t.stun>0?0:t.spd)-t.cur)*Math.min(1,3*dt);
  t.pos+=t.cur*dt;if(t.pos>320)t.pos=-320;tplace(t);t.wh.forEach(w=>w.w.rotation.x+=t.cur*dt/.4)}
 let imp=0;
 if(play)imp=phys(P,K,dt);
 P.g.userData.tail.emissiveIntensity=K.d&&play?3.5:.8;
 if(play){
  if(imp>6){hurt(imp*.9);if(imp>12)crime(12,'BATIDA! Polícia alertada')}
  if(P.y>.05)airT+=dt;else{if(airT>.7){const v=Math.floor(airT*150);earn(v);say('SALTO! +$'+v)}airT=0}
  for(const t of traffic){const dx=P.x-t.x,dz=P.z-t.z,d=Math.hypot(dx,dz);
   if(d<2.7&&d>.01&&P.y<1.2){const nx=dx/d,nz=dz/d,vn=P.vx*nx+P.vz*nz;P.x+=nx*(2.7-d);P.z+=nz*(2.7-d);
    if(vn<-2){P.vx-=1.5*vn*nx;P.vz-=1.5*vn*nz;hurt(-vn*.8);crime(25);t.stun=2}}}
  // polícia: persegue, bate no carro e perde vida do jogador
  let near=false;const want=[0,1,2,4,6,8][stars];let act=cops.filter(c=>c.on).length;
  for(const c of cops){if(!c.on)continue;
   const dx=P.x-c.x,dz=P.z-c.z,d=Math.hypot(dx,dz);
   if(!stars){c.on=false;c.g.visible=false;act--;continue}
   if(d<90)near=true;if(d<45)chase=Math.max(chase,5);if(d<20)heat=Math.min(100,heat+2.5*dt);
   if(act>want&&d>90){c.on=false;c.g.visible=false;act--;continue}
   c.top=30+stars*5;c.acc=5+stars*2.5;
   const ld=Math.min(1,d/40)*.6;let df=adiff(Math.atan2(P.x+P.vx*ld-c.x,P.z+P.vz*ld-c.z),c.h);
   const sp=Math.hypot(c.vx,c.vz),bc=ahead(c,0,14),bL=ahead(c,.7,10),bR=ahead(c,-.7,10);
   if(bc||bL||bR){if(bL&&!bR)df=-1;else if(bR&&!bL)df=1;else if(bc)df=df>=0?1:-1}
   if(sp<2.5)c.stuck+=dt;else c.stuck=0;if(c.stuck>1.2){c.rev=1;c.stuck=0}
   const inp=c.rev>0?{d:1,r:df>0,l:df<0}:{u:!bc||sp<8,l:df>.08,r:df<-.08};c.rev=Math.max(0,c.rev-dt);
   phys(c,inp,dt);
   if(d<2.8&&d>.01){const nx=dx/d,nz=dz/d,vr=(P.vx-c.vx)*nx+(P.vz-c.vz)*nz;
    P.x+=nx*(2.8-d)/2;P.z+=nz*(2.8-d)/2;c.x-=nx*(2.8-d)/2;c.z-=nz*(2.8-d)/2;
    if(vr<0){P.vx-=nx*vr*.6;P.vz-=nz*vr*.6;c.vx+=nx*vr*.6;c.vz+=nz*vr*.6;hurt(Math.max(4,Math.min(16,-vr*1.1)))}}
   const f=Math.floor(tt*7)%2;c.g.userData.lb[0].material.emissiveIntensity=f?4:.1;c.g.userData.lb[1].material.emissiveIntensity=f?.1:4}
  for(let i=0;i<cops.length;i++)for(let j=i+1;j<cops.length;j++){const p=cops[i],q=cops[j];if(!p.on||!q.on)continue;
   const dx=p.x-q.x,dz=p.z-q.z,d=Math.hypot(dx,dz);if(d<2.8&&d>.01){const o=(2.8-d)/2;p.x+=dx/d*o;p.z+=dz/d*o;q.x-=dx/d*o;q.z-=dz/d*o}}
  chase-=dt;if(chase<=0&&!near)heat=Math.max(0,heat-6*dt);
  const ns=heat<15?0:heat<35?1:heat<55?2:heat<75?3:heat<90?4:5;
  if(stars>0&&ns==0){say('VOCÊ ESCAPOU! +$1500');earn(1500)}else if(ns>stars&&stars>0)say('PROCURADO NÍVEL '+ns+'!');
  stars=ns;spawnT-=dt;if(act<[0,1,2,4,6,8][ns]&&spawnT<=0){const c=cops.find(c=>!c.on);if(c){spawnCop(c);spawnT=.6}}
  // drift
  const spd=Math.hypot(P.vx,P.vz),fx=Math.sin(P.h),fz=Math.cos(P.h);
  if(P.y<.05&&Math.abs(P.vl)>3&&spd>7){combo+=Math.abs(P.vl)*dt*10;dtm=.7;
   for(const s of[-1,1]){const rx=P.x-fx*1.4+fz*s*.8,rz=P.z-fz*1.4-fx*s*.8;skid(rx,rz,P.h+Math.atan2(P.vl,P.vf)*-.0);if(Math.random()<.6)puff(rx,.5,rz)}}
  else if(dtm>0){dtm-=dt;if(dtm<=0){earn(combo);combo=0}}
  if(imp>6)combo=0;
  $('spd').textContent=Math.round(spd*3.6)+' km/h';$('dr').textContent=combo>5?'DRIFT +'+Math.floor(combo):'';
  $('sc').textContent='Pontos: '+score;$('mo').textContent='$'+money;$('hp').style.width=hp+'%';$('st').textContent='★'.repeat(stars)+'☆'.repeat(5-stars)}
 smoke.forEach(s=>{if(s.life>0){s.life-=dt*1.4;s.m.position.y+=dt*1.2;s.m.scale.setScalar(1+(1-s.life)*3);s.m.material.opacity=Math.max(0,s.life*.55);if(s.life<=0)s.m.visible=false}});
 const spd=Math.hypot(P.vx,P.vz);
 if(state=='menu'){const a=tt*.4;cam.position.set(P.x+Math.sin(a)*6.5,1.8,P.z+Math.cos(a)*6.5);cam.lookAt(P.x,-.5,P.z)}
 else{camH+=adiff(P.h,camH)*Math.min(1,4*dt);
  const cx=P.x-Math.sin(camH)*9,cz=P.z-Math.cos(camH)*9,k=Math.min(1,8*dt);
  cam.position.x+=(cx-cam.position.x)*k;cam.position.z+=(cz-cam.position.z)*k;cam.position.y+=(P.y+4.3-cam.position.y)*Math.min(1,6*dt);
  cam.position.x+=(Math.random()-.5)*shake;cam.position.y+=(Math.random()-.5)*shake;
  cam.lookAt(P.x+Math.sin(camH)*4,P.y+1.2,P.z+Math.cos(camH)*4)}
 const fov=65+Math.min(18,spd*.3);if(Math.abs(cam.fov-fov)>.1){cam.fov+=(fov-cam.fov)*.1;cam.updateProjectionMatrix()}
 sky.position.copy(cam.position);sun.position.set(P.x+60,100,P.z+40);sun.target.position.set(P.x,0,P.z)}
(function loop(t){requestAnimationFrame(loop);const dt=Math.min(.05,(t-last)/1000);last=t;step(dt);ren.render(scene,cam)})(last);
</script></body></html>
